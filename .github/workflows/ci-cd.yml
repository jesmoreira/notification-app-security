name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "feat/seguranca-e-devsecops" ] # Adicionado sua branch aqui!
  pull_request:
    branches: [ "main" ]

jobs:
  security-scan:
    name: 🛡️ Security Analysis (SAST & Secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Detekt SAST
        working-directory: ./notifications-backend
        run: |
          chmod +x gradlew
          ./gradlew detekt

  backend-test-build:
    name: Backend - Test & Build
    needs: security-scan
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: notifications_db
        ports: ["5432:5432"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Grant execute permission
        run: chmod +x notifications-backend/gradlew
      - name: Build JAR
        working-directory: ./notifications-backend
        run: ./gradlew shadowJar