name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Detekt SAST
        working-directory: ./notifications-backend
        run: |
          chmod +x gradlew
          ./gradlew detekt

  backend-test-build:
    name: Backend - Test & Build
    needs: security-scan
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: notifications_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      localstack:
        image: localstack/localstack
        env:
          SERVICES: sqs
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Create Queues in CI LocalStack
        run: |
          docker exec ${{ job.services.localstack.id }} awslocal sqs create-queue --queue-name notifications_queue

      - name: Grant execute permission for gradlew
        run: chmod +x notifications-backend/gradlew

      - name: Run Tests (Unit & Integration)
        working-directory: ./notifications-backend
        run: ./gradlew test
        env:
          DATASOURCES_DEFAULT_URL: jdbc:postgresql://localhost:5432/notifications_db
          AWS_ENDPOINT_OVERRIDE: http://localhost:4566
          AWS_AccessKeyId: test
          AWS_SecretKey: test
          AWS_Region: us-east-1

      - name: Build JAR
        working-directory: ./notifications-backend
        run: ./gradlew shadowJar

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: notifications-backend/build/libs/*-all.jar

  frontend-test-build:
    name: Frontend - Check & Build
    needs: security-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: notifications-frontend/yarn.lock

      - name: Install Dependencies
        working-directory: ./notifications-frontend
        run: yarn install --frozen-lockfile

      - name: Build Production Bundle
        working-directory: ./notifications-frontend
        run: yarn build

  docker-publish:
    name: Build & Push Docker Images
    needs: [ backend-test-build, frontend-test-build ]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./notifications-backend
          file: ./notifications-backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/notification-service:latest,${{ secrets.DOCKER_USERNAME }}/notification-service:${{ github.sha }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./notifications-frontend
          file: ./notifications-frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/notification-frontend:latest,${{ secrets.DOCKER_USERNAME }}/notification-frontend:${{ github.sha }}